
<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гамшгаас хамгаалах тайлангийн систем</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f1f5f9;color:#1e293b;
 font-family:Arial,sans-serif;padding:15px
}
.container{max-width:900px;margin:auto}
.card{
 background:white;border:1px solid #dbe1e8;border-radius:14px;
 padding:22px;margin-bottom:18px
}
h1,h2{margin-top:0}
h1{font-size:24px;color:#164e83}
h2{font-size:21px}
label{display:block;margin:15px 0 7px;font-weight:600}
input,select,textarea{
 width:100%;padding:14px;border:1px solid #cbd5e1;
 border-radius:10px;font-size:17px;background:white
}
textarea{min-height:100px}
button{
 border:0;border-radius:9px;padding:13px 17px;
 font-size:16px;font-weight:bold;cursor:pointer
}
.primary{background:#1769a6;color:white}
.secondary{background:#e5eef8;color:#174675}
.danger{background:#fee2e2;color:#991b1b}
.small{padding:9px 12px;font-size:14px}
.hidden{display:none!important}
.item{
 border:1px solid #dbe1e8;border-radius:12px;
 padding:15px;margin:12px 0
}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.status{color:#64748b;font-size:14px}
#message{margin-top:15px;font-weight:bold}
</style>
</head>

<body>
<div class="container">

<!-- НЭВТРЭХ -->
<div class="card" id="loginCard">
<h1>Гамшгаас хамгаалах тайлангийн систем</h1>
<h2>Нэвтрэх</h2>

<label>И-мэйл</label>
<input id="email" type="email" placeholder="И-мэйл">

<label>Нууц үг</label>
<input id="password" type="password" placeholder="Нууц үг">

<button class="primary" style="width:100%;margin-top:18px"
onclick="login()">Нэвтрэх</button>

<div id="loginMessage"></div>
</div>

<!-- СИСТЕМ -->
<div id="app" class="hidden">

<div class="card">
<h1>Гамшгаас хамгаалах сургалтын тайлан</h1>
<p id="userInfo"></p>
<button class="secondary" onclick="logout()">Гарах</button>
</div>

<!-- ТАЙЛАН БҮРТГЭХ / ЗАСВАРЛАХ -->
<div class="card">
<h2 id="formTitle">Тайлан бүртгэх</h2>

<form id="reportForm" onsubmit="saveReport(event)">

<label>Тайлангийн төрөл</label>
<select id="type" required>
<option value="СМ-1">СМ-1</option>
<option value="СМ-2">СМ-2</option>
<option value="СМ-3">СМ-3</option>
<option value="СМ-4">СМ-4</option>
<option value="Бусад">Бусад</option>
</select>

<label>Тайлангийн он</label>
<input id="year" type="number" value="2026" required>

<label>Сар</label>
<select id="month" required>
<option value="">Сар сонгох</option>
<option value="1">1</option><option value="2">2</option>
<option value="3">3</option><option value="4">4</option>
<option value="5">5</option><option value="6">6</option>
<option value="7">7</option><option value="8">8</option>
<option value="9">9</option><option value="10">10</option>
<option value="11">11</option><option value="12">12</option>
</select>

<label>Тайлангийн нэр</label>
<input id="title" required placeholder="Тайлангийн нэр">

<label>Тайлбар</label>
<textarea id="description" placeholder="Тайлбар"></textarea>

<div class="actions">
<button class="primary" id="saveButton" type="submit">
Тайлан хадгалах
</button>
<button class="secondary hidden" id="cancelButton"
type="button" onclick="cancelEdit()">Болих</button>
</div>

<div id="message"></div>
</form>
</div>

<!-- ЖАГСААЛТ -->
<div class="card">
<h2>Тайлангийн жагсаалт</h2>
<button class="secondary" onclick="loadReports()">Шинэчлэх</button>
<div id="reportList">Ачаалж байна...</div>
</div>
</div>
</div>

<script>
const SUPABASE_URL =
"https://djzlkhvkpmhgxoykeozt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_iBVTq-ruWQDXLWTEO4wqAA_PT1AKG3d";

const db = window.supabase.createClient(
SUPABASE_URL,SUPABASE_KEY
);

let currentUser=null;
let editingId=null;

// НЭВТРЭХ
async function login(){
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

const msg=document.getElementById("loginMessage");
msg.textContent="Нэвтэрч байна...";

const {data,error}=await db.auth.signInWithPassword({
email,password
});

if(error){
msg.textContent="Алдаа: "+error.message;
return;
}

currentUser=data.user;
showApp();
}

// АПП НЭЭХ
async function showApp(){
document.getElementById("loginCard").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");

document.getElementById("userInfo").textContent=
"Нэвтэрсэн: "+currentUser.email;

await loadReports();
}

// ГАРАХ
async function logout(){
await db.auth.signOut();
currentUser=null;
editingId=null;

document.getElementById("app").classList.add("hidden");
document.getElementById("loginCard").classList.remove("hidden");
}

// ТАЙЛАН ХАДГАЛАХ / ШИНЭЧЛЭХ
async function saveReport(event){
event.preventDefault();

if(!currentUser){
alert("Эхлээд нэвтэрнэ үү");
return;
}

const month=document.getElementById("month").value;
const title=document.getElementById("title").value.trim();

if(!title){
alert("Тайлангийн нэр оруулна уу");
return;
}

const record={
province_id:17,
report_type:document.getElementById("type").value,
report_year:Number(document.getElementById("year").value),
report_month:month?Number(month):null,
title:title,
description:document.getElementById("description").value,
created_by:currentUser.id
};

const msg=document.getElementById("message");
msg.textContent="Хадгалж байна...";

let result;

if(editingId){
result=await db
.from("reports")
.update(record)
.eq("id",editingId)
.eq("created_by",currentUser.id);
}else{
record.status="draft";
result=await db.from("reports").insert(record);
}

if(result.error){
msg.textContent="Алдаа: "+result.error.message;
return;
}

msg.textContent=editingId?
"Өөрчлөлт амжилттай хадгалагдлаа!":
"Тайлан хадгалагдлаа!";

cancelEdit();
await loadReports();
}

// ТАЙЛАНГИЙН ЖАГСААЛТ
async function loadReports(){
const list=document.getElementById("reportList");
list.innerHTML="Ачаалж байна...";

const {data,error}=await db
.from("reports")
.select("*")
.eq("created_by",currentUser.id)
.order("created_at",{ascending:false});

if(error){
list.textContent="Алдаа: "+error.message;
return;
}

if(!data||data.length===0){
list.innerHTML="<p>Тайлан бүртгэгдээгүй байна.</p>";
return;
}

list.innerHTML="";

data.forEach(report=>{
const item=document.createElement("div");
item.className="item";

const name=document.createElement("h3");
name.textContent=report.title;

const info=document.createElement("p");
info.textContent=
(report.report_type||"")+" | "+
(report.report_year||"")+" | "+
(report.report_month||"")+" сар";

const desc=document.createElement("p");
desc.textContent=report.description||"";

const status=document.createElement("p");
status.className="status";
status.textContent="Төлөв: "+(report.status||"draft");

const actions=document.createElement("div");
actions.className="actions";

const editBtn=document.createElement("button");
editBtn.className="secondary small";
editBtn.textContent="✏️ Засварлах";
editBtn.onclick=()=>editReport(report);

const deleteBtn=document.createElement("button");
deleteBtn.className="danger small";
deleteBtn.textContent="🗑 Устгах";
deleteBtn.onclick=()=>deleteReport(report.id);

actions.append(editBtn,deleteBtn);
item.append(name,info,desc,status,actions);
list.appendChild(item);
});
}

// ЗАСВАРЛАХ
function editReport(report){
editingId=report.id;

document.getElementById("type").value=
report.report_type||"СМ-1";

document.getElementById("year").value=
report.report_year||2026;

document.getElementById("month").value=
report.report_month||"";

document.getElementById("title").value=
report.title||"";

document.getElementById("description").value=
report.description||"";

document.getElementById("formTitle").textContent=
"Тайлан засварлах";

document.getElementById("saveButton").textContent=
"Өөрчлөлт хадгалах";

document.getElementById("cancelButton").classList.remove("hidden");

document.getElementById("message").textContent=
"Засварлах горим идэвхтэй.";

window.scrollTo({top:0,behavior:"smooth"});
}

// ЗАСВАР БОЛИХ
function cancelEdit(){
editingId=null;

document.getElementById("reportForm").reset();
document.getElementById("year").value=2026;

document.getElementById("formTitle").textContent=
"Тайлан бүртгэх";

document.getElementById("saveButton").textContent=
"Тайлан хадгалах";

document.getElementById("cancelButton").classList.add("hidden");
}

// УСТГАХ
async function deleteReport(id){
if(!confirm("Энэ тайланг устгах уу?")){
return;
}

const {error}=await db
.from("reports")
.delete()
.eq("id",id)
.eq("created_by",currentUser.id);

if(error){
alert("Устгах алдаа: "+error.message);
return;
}

alert("Тайлан устгагдлаа.");
await loadReports();
}

// АВТО НЭВТРЭЛТ ШАЛГАХ
async function init(){
const {data}=await db.auth.getSession();

if(data.session){
currentUser=data.session.user;
showApp();
}
}

init();
</script>
</body>
</html>
