
<!-- АДМИН: 30 БАЙГУУЛЛАГА ҮҮСГЭХ -->
<section id="admin-create-box" style="display:none;padding:20px;margin:20px 0;border:1px solid #ddd;border-radius:12px;">
  <h3>Байгууллагын хэрэглэгч бүртгэх</h3>

  <p>21 аймаг + 9 дүүргийн хэрэглэгч үүсгэнэ.</p>

  <button id="createInstitutionsBtn"
    style="background:#2563eb;color:white;padding:12px 20px;border:0;border-radius:8px;font-size:16px;">
    30 байгууллага үүсгэх
  </button>

  <button id="downloadInstitutionsBtn"
    style="display:none;background:#16a34a;color:white;padding:12px 20px;border:0;border-radius:8px;margin-top:10px;">
    Үр дүн татах
  </button>

  <pre id="createInstitutionsResult"
    style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f5f5;padding:12px;border-radius:8px;margin-top:15px;"></pre>
</section>

<script>
(() => {
  const initAdminInstitutionButton = async () => {
    const box = document.getElementById("admin-create-box");
    const btn = document.getElementById("createInstitutionsBtn");
    const result = document.getElementById("createInstitutionsResult");
    const downloadBtn = document.getElementById("downloadInstitutionsBtn");

    if (!box || !btn || !result || !downloadBtn) return;

    // Supabase клиент байгаа эсэх
    if (typeof supabase === "undefined") {
      result.textContent = "Supabase клиент олдсонгүй.";
      return;
    }

    // Админ нэвтэрсэн эсэх
    const { data: sessionData, error: sessionError } =
      await supabase.auth.getSession();

    if (sessionError || !sessionData.session) return;

    // Админ эрх шалгах
    const { data: profile, error: profileError } = await supabase
      .from("user_profiles")
      .select("role")
      .eq("user_id", sessionData.session.user.id)
      .single();

    if (profileError || profile?.role !== "admin") return;

    box.style.display = "block";

    let savedResult = null;

    // Үр дүнг CSV файлаар татах
    downloadBtn.onclick = () => {
      if (!savedResult?.results) return;

      const rows = [
        ["Байгууллага", "Email", "Password", "Status", "Error"],
        ...savedResult.results.map(x => [
          x.name || "",
          x.email || "",
          x.password || "",
          x.status || "",
          x.error || ""
        ])
      ];

      const csv = rows.map(row =>
        row.map(value =>
          '"' + String(value).replace(/"/g, '""') + '"'
        ).join(",")
      ).join("\r\n");

      const blob = new Blob(["\uFEFF" + csv], {
        type: "text/csv;charset=utf-8;"
      });

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "30-baiguullaga-hereglegch.csv";
      a.click();
      URL.revokeObjectURL(url);
    };

    // 30 хэрэглэгч үүсгэх
    btn.onclick = async () => {
      const ok = confirm(
        "21 аймаг + 9 дүүргийн хэрэглэгч үүсгэх үү?"
      );

      if (!ok) return;

      btn.disabled = true;
      downloadBtn.style.display = "none";
      result.textContent = "Бүртгэл үүсгэж байна...";

      try {
        const { data, error } = await supabase.functions.invoke(
          "super-handler",
          { body: {} }
        );

        if (error) throw error;

        savedResult = data;

        result.textContent = JSON.stringify(data, null, 2);

        if (data.results?.length) {
          downloadBtn.style.display = "inline-block";
        }

      } catch (error) {
        result.textContent =
          "Алдаа гарлаа:\n" + (error.message || String(error));
      } finally {
        btn.disabled = false;
      }
    };
  };

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      initAdminInstitutionButton,
      { once: true }
    );
  } else {
    initAdminInstitutionButton();
  }
})();
</script>
