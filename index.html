
<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гамшгаас хамгаалах сургалтын систем</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef2f7;
  color:#263445;
}
header{
  background:#245b96;
  color:white;
  padding:22px 16px;
  text-align:center;
}
header h2{margin:0;font-size:22px}
header p{margin:8px 0 0;font-size:14px}
.container{
  max-width:1100px;
  margin:20px auto;
  padding:0 14px;
}
.card{
  background:white;
  border-radius:16px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
}
h3{
  color:#245b96;
  margin-top:0;
}
label{
  display:block;
  font-weight:bold;
  margin:14px 0 7px;
}
input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccd5df;
  border-radius:10px;
  font-size:16px;
  background:white;
}
textarea{
  min-height:150px;
  resize:vertical;
}
button{
  border:0;
  border-radius:10px;
  padding:13px 20px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.primary{
  background:#2863a2;
  color:white;
}
.secondary{
  background:#e3eaf2;
  color:#244b77;
}
.danger{
  background:#fde5e5;
  color:#b32626;
}
button:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.hidden{display:none!important}
.status{
  margin-top:12px;
  color:#245b96;
  font-weight:bold;
}
.table-wrap{
  overflow-x:auto;
  width:100%;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}
th,td{
  padding:14px 10px;
  border-bottom:1px solid #e1e6ed;
  text-align:left;
  vertical-align:middle;
}
th{
  background:#f5f7fa;
  font-weight:bold;
}
td button{
  padding:9px 12px;
  font-size:14px;
  margin:2px;
}
.actions{
  white-space:nowrap;
}
.report-name{
  font-weight:bold;
  color:#245b96;
}
.small{
  color:#66788c;
  font-size:13px;
}
footer{
  text-align:center;
  padding:20px;
  color:#718096;
  font-size:13px;
}
@media(max-width:650px){
  header h2{font-size:19px}
  .container{padding:0 10px}
  .card{padding:16px;border-radius:13px}
  .grid{grid-template-columns:1fr}
  .buttons button{flex:1}
  table{min-width:0}
  thead{display:none}
  tbody tr{
    display:block;
    border:1px solid #e1e6ed;
    border-radius:12px;
    margin-bottom:12px;
    padding:10px;
    background:#fff;
  }
  tbody td{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:10px 4px;
    border-bottom:1px solid #edf0f4;
    text-align:right;
    overflow-wrap:anywhere;
  }
  tbody td:last-child{border-bottom:0}
  tbody td::before{
    content:attr(data-label);
    font-weight:bold;
    color:#52677f;
    text-align:left;
    flex-shrink:0;
  }
  tbody td.actions{
    justify-content:flex-end;
    flex-wrap:wrap;
  }
  tbody td.actions::before{
    margin-right:auto;
  }
  td button{
    font-size:14px;
    padding:10px 12px;
  }
}
</style>
</head>

<body>

<header>
  <h2>ГАМШГААС ХАМГААЛАХ СУРГАЛТЫН СИСТЕМ</h2>
  <p>Тайлан бүртгэл, мэдээллийн нэгдсэн систем</p>
</header>

<div class="container">

<!-- НЭВТРЭХ -->
<div class="card" id="loginCard">
  <h3>Системд нэвтрэх</h3>

  <label>И-мэйл</label>
  <input type="email" id="email" placeholder="И-мэйл хаяг">

  <label>Нууц үг</label>
  <input type="password" id="password" placeholder="Нууц үг">

  <div class="buttons">
    <button class="primary" onclick="login()">Нэвтрэх</button>
  </div>

  <div class="status" id="loginStatus"></div>
</div>

<!-- ҮНДСЭН СИСТЕМ -->
<div id="app" class="hidden">

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <div>
        <h3 style="margin-bottom:5px">Тайлангийн бүртгэл</h3>
        <div id="userEmail" class="small"></div>
      </div>
      <button class="secondary" onclick="logout()">Гарах</button>
    </div>
  </div>

  <!-- ТАЙЛАН БҮРТГЭХ -->
  <div class="card">
    <h3 id="formTitle">Шинэ тайлан бүртгэх</h3>

    <input type="hidden" id="editId">

    <div class="grid">
      <div>
        <label>Аймаг / нийслэл *</label>
        <select id="province" onchange="loadUnits()">
          <option value="">Аймаг сонгоно уу</option>
        </select>
      </div>

      <div>
        <label>Сум / дүүрэг *</label>
        <select id="unit">
          <option value="">Сум сонгоно уу</option>
        </select>
      </div>
    </div>

    <label>Тайлангийн төрөл *</label>
    <select id="reportType" onchange="changePeriod()">
      <option value="month">Сарын тайлан</option>
      <option value="quarter">Улирлын тайлан</option>
      <option value="half">Хагас жилийн тайлан</option>
    </select>

    <div class="grid">
      <div>
        <label>Тайлангийн жил *</label>
        <select id="reportYear"></select>
      </div>

      <div id="monthBox">
        <label>Сар *</label>
        <select id="reportMonth">
          <option value="1">1 сар</option>
          <option value="2">2 сар</option>
          <option value="3">3 сар</option>
          <option value="4">4 сар</option>
          <option value="5">5 сар</option>
          <option value="6">6 сар</option>
          <option value="7">7 сар</option>
          <option value="8">8 сар</option>
          <option value="9">9 сар</option>
          <option value="10">10 сар</option>
          <option value="11">11 сар</option>
          <option value="12">12 сар</option>
        </select>
      </div>

      <div id="quarterBox" class="hidden">
        <label>Улирал *</label>
        <select id="reportQuarter">
          <option value="1">I улирал</option>
          <option value="2">II улирал</option>
          <option value="3">III улирал</option>
          <option value="4">IV улирал</option>
        </select>
      </div>

      <div id="halfBox" class="hidden">
        <label>Хагас жил *</label>
        <select id="reportHalf">
          <option value="1">I хагас жил</option>
          <option value="2">II хагас жил</option>
        </select>
      </div>
    </div>

    <label>Тайлангийн гарчиг *</label>
    <input id="title" placeholder="Тайлангийн гарчиг">

    <label>Тайлангийн агуулга *</label>
    <textarea id="description" placeholder="Хийгдсэн ажлын мэдээлэл, тайлангийн агуулга"></textarea>

    <div class="buttons">
      <button class="primary" id="saveBtn" onclick="saveReport()">Тайлан хадгалах</button>
      <button class="secondary hidden" id="cancelBtn" onclick="cancelEdit()">Болих</button>
    </div>

    <div class="status" id="formStatus"></div>
  </div>

  <!-- ТАЙЛАНГИЙН ЖАГСААЛТ -->
  <div class="card">
    <h3>Миний бүртгэсэн тайлан</h3>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>№</th>
            <th>Аймаг / сум</th>
            <th>Хугацаа</th>
            <th>Гарчиг</th>
            <th>Үйлдэл</th>
          </tr>
        </thead>
        <tbody id="reportsTableBody">
          <tr><td colspan="5">Тайлан ачаалж байна...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</div>

<footer>
  Гамшгаас хамгаалах сургалтын систем
</footer>

<script>
// ========================================
// SUPABASE ТОХИРГОО
// ========================================
const SUPABASE_URL = "https://djzlkhvkpmhgxoykeozt.supabase.co";
const SUPABASE_KEY = "sb_publishable_iBVTq-ruWQDXLWTEO4wqAA_PT1AKG3d";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;

// ========================================
// НЭВТРЭХ
// ========================================
async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const status = document.getElementById("loginStatus");

  status.textContent = "Нэвтэрч байна...";

  const {data,error} = await supabase.auth.signInWithPassword({
    email,password
  });

  if(error){
    status.textContent = "Алдаа: " + error.message;
    return;
  }

  currentUser = data.user;
  showApp();
}

// ========================================
// ГАРАХ
// ========================================
async function logout(){
  await supabase.auth.signOut();
  currentUser = null;

  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginCard").classList.remove("hidden");
}

// ========================================
// СИСТЕМ НЭЭХ
// ========================================
function showApp(){
  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("userEmail").textContent = currentUser.email;

  loadProvinces();
  loadReports();
}

// ========================================
// АЙМАГ АЧААЛАХ
// ========================================
async function loadProvinces(){
  const select = document.getElementById("province");

  const {data,error} = await supabase
    .from("provinces")
    .select("id,name")
    .order("id");

  if(error){
    alert("Аймаг татах алдаа: " + error.message);
    return;
  }

  select.innerHTML = '<option value="">Аймаг сонгоно уу</option>';

  (data || []).forEach(p=>{
    select.innerHTML += `
      <option value="${p.id}">${escapeHtml(p.name)}</option>
    `;
  });
}

// ========================================
// СУМ / ДҮҮРЭГ АЧААЛАХ
// ========================================
async function loadUnits(){
  const provinceId = document.getElementById("province").value;
  const unitSelect = document.getElementById("unit");

  unitSelect.innerHTML = '<option value="">Сум сонгоно уу</option>';

  if(!provinceId) return;

  const {data,error} = await supabase
    .from("units")
    .select("id,name")
    .eq("province_id",provinceId)
    .order("name");

  if(error){
    alert("Сум татах алдаа: " + error.message);
    return;
  }

  (data || []).forEach(u=>{
    unitSelect.innerHTML += `
      <option value="${u.id}">${escapeHtml(u.name)}</option>
    `;
  });
}

// ========================================
// ТАЙЛАНГИЙН ТӨРӨЛ СОЛИХ
// ========================================
function changePeriod(){
  const type = document.getElementById("reportType").value;

  document.getElementById("monthBox").classList.toggle("hidden",type!=="month");
  document.getElementById("quarterBox").classList.toggle("hidden",type!=="quarter");
  document.getElementById("halfBox").classList.toggle("hidden",type!=="half");
}

// ========================================
// ЖИЛИЙН СОНГОЛТ
// ========================================
function initYears(){
  const select = document.getElementById("reportYear");
  const currentYear = new Date().getFullYear();

  select.innerHTML = "";

  for(let y=currentYear-2;y<=currentYear+1;y++){
    select.innerHTML += `<option value="${y}">${y}</option>`;
  }

  select.value = currentYear;
}

// ========================================
// ТАЙЛАН ХАДГАЛАХ / ЗАСАХ
// ========================================
async function saveReport(){
  const status = document.getElementById("formStatus");
  const saveBtn = document.getElementById("saveBtn");

  const provinceId = document.getElementById("province").value;
  const unitId = document.getElementById("unit").value;
  const type = document.getElementById("reportType").value;
  const year = Number(document.getElementById("reportYear").value);
  const title = document.getElementById("title").value.trim();
  const description = document.getElementById("description").value.trim();
  const editId = document.getElementById("editId").value;

  if(!provinceId || !unitId || !title || !description){
    status.textContent = "Бүх шаардлагатай талбарыг бөглөнө үү.";
    return;
  }

  const payload = {
    province_id:Number(provinceId),
    unit_id:Number(unitId),
    report_type:type,
    report_year:year,
    report_month:type==="month"
      ? Number(document.getElementById("reportMonth").value)
      : null,
    report_quarter:type==="quarter"
      ? Number(document.getElementById("reportQuarter").value)
      : null,
    report_half:type==="half"
      ? Number(document.getElementById("reportHalf").value)
      : null,
    title,
    description,
    created_by:currentUser.id
  };

  saveBtn.disabled = true;
  status.textContent = "Хадгалж байна...";

  let result;

  if(editId){
    result = await supabase
      .from("reports")
      .update(payload)
      .eq("id",editId)
      .eq("created_by",currentUser.id);
  }else{
    result = await supabase
      .from("reports")
      .insert(payload);
  }

  saveBtn.disabled = false;

  if(result.error){
    status.textContent = "Алдаа: " + result.error.message;
    return;
  }

  status.textContent = "Тайлан амжилттай хадгалагдлаа.";

  cancelEdit();
  await loadReports();
}

// ========================================
// ТАЙЛАНГИЙН ЖАГСААЛТ
// ========================================
async function loadReports(){
  const tbody = document.getElementById("reportsTableBody");

  tbody.innerHTML = `
    <tr><td colspan="5">Ачаалж байна...</td></tr>
  `;

  const {data:reports,error} = await supabase
    .from("reports")
    .select("*")
    .eq("created_by",currentUser.id)
    .order("created_at",{ascending:false});

  if(error){
    tbody.innerHTML = `
      <tr><td colspan="5">Алдаа: ${escapeHtml(error.message)}</td></tr>
    `;
    return;
  }

  const {data:provinces} = await supabase
    .from("provinces")
    .select("id,name");

  const {data:units} = await supabase
    .from("units")
    .select("id,name");

  const provinceMap = Object.fromEntries(
    (provinces || []).map(p=>[String(p.id),p.name])
  );

  const unitMap = Object.fromEntries(
    (units || []).map(u=>[String(u.id),u.name])
  );

  if(!reports || reports.length===0){
    tbody.innerHTML = `
      <tr><td colspan="5">Одоогоор тайлан бүртгээгүй байна.</td></tr>
    `;
    return;
  }

  tbody.innerHTML = reports.map((r,i)=>{
    const provinceName = provinceMap[String(r.province_id)] || "Аймаг";
    const unitName = unitMap[String(r.unit_id)] || "Сум";

    let period = r.report_year;

    if(r.report_type==="month"){
      period += " · " + (r.report_month || "") + " сар";
    }else if(r.report_type==="quarter"){
      period += " · " + (r.report_quarter || "") + " улирал";
    }else if(r.report_type==="half"){
      period += " · " + (r.report_half || "") + " хагас жил";
    }

    return `
      <tr>
        <td data-label="№">${i+1}</td>

        <td data-label="Аймаг / сум">
          <span class="report-name">
            ${escapeHtml(provinceName)} /
            ${escapeHtml(unitName)}
          </span>
        </td>

        <td data-label="Хугацаа">
          ${escapeHtml(String(period))}
        </td>

        <td data-label="Гарчиг">
          ${escapeHtml(r.title || "")}
        </td>

        <td data-label="Үйлдэл" class="actions">
          <button class="secondary" onclick="editReport(${r.id})">
            Засах
          </button>

          <button class="danger" onclick="deleteReport(${r.id})">
            Устгах
          </button>
        </td>
      </tr>
    `;
  }).join("");
}

// ========================================
// ТАЙЛАН ЗАСАХ
// ========================================
async function editReport(id){
  const {data:r,error} = await supabase
    .from("reports")
    .select("*")
    .eq("id",id)
    .eq("created_by",currentUser.id)
    .single();

  if(error){
    alert("Тайлан авах алдаа: " + error.message);
    return;
  }

  document.getElementById("editId").value = r.id;
  document.getElementById("formTitle").textContent = "Тайлан засах";

  document.getElementById("province").value = r.province_id;
  await loadUnits();

  document.getElementById("unit").value = r.unit_id || "";
  document.getElementById("reportType").value = r.report_type;
  document.getElementById("reportYear").value = r.report_year;

  document.getElementById("reportMonth").value = r.report_month || 1;
  document.getElementById("reportQuarter").value = r.report_quarter || 1;
  document.getElementById("reportHalf").value = r.report_half || 1;

  document.getElementById("title").value = r.title || "";
  document.getElementById("description").value = r.description || "";

  changePeriod();

  document.getElementById("saveBtn").textContent = "Өөрчлөлт хадгалах";
  document.getElementById("cancelBtn").classList.remove("hidden");
  document.getElementById("formStatus").textContent = "";

  window.scrollTo({top:0,behavior:"smooth"});
}

// ========================================
// ЗАСВАР ЦУЦЛАХ
// ========================================
function cancelEdit(){
  document.getElementById("editId").value = "";
  document.getElementById("formTitle").textContent = "Шинэ тайлан бүртгэх";

  document.getElementById("province").value = "";
  document.getElementById("unit").innerHTML =
    '<option value="">Сум сонгоно уу</option>';

  document.getElementById("reportType").value = "month";
  document.getElementById("reportYear").value = new Date().getFullYear();
  document.getElementById("reportMonth").value = 1;
  document.getElementById("reportQuarter").value = 1;
  document.getElementById("reportHalf").value = 1;

  document.getElementById("title").value = "";
  document.getElementById("description").value = "";

  document.getElementById("saveBtn").textContent = "Тайлан хадгалах";
  document.getElementById("cancelBtn").classList.add("hidden");
  document.getElementById("formStatus").textContent = "";

  changePeriod();
}

// ========================================
// ТАЙЛАН УСТГАХ
// ========================================
async function deleteReport(id){
  if(!confirm("Энэ тайланг устгах уу?")) return;

  const {error} = await supabase
    .from("reports")
    .delete()
    .eq("id",id)
    .eq("created_by",currentUser.id);

  if(error){
    alert("Устгах алдаа: " + error.message);
    return;
  }

  alert("Тайлан устгагдлаа.");
  loadReports();
}

// ========================================
// HTML АЮУЛГҮЙ БОЛГОХ
// ========================================
function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

// ========================================
// СИСТЕМ АСАХ
// ========================================
async function init(){
  initYears();

  const {data} = await supabase.auth.getSession();

  if(data.session){
    currentUser = data.session.user;
    showApp();
  }

  supabase.auth.onAuthStateChange((event,session)=>{
    if(session && !currentUser){
      currentUser = session.user;
      showApp();
    }
  });
}

init();
</script>

</body>
</html>
