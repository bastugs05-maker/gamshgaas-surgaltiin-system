
<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гамшгаас хамгаалах сургалтын систем</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b}
header{background:#173e75;color:white;padding:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
header h1{font-size:20px;margin:0}
main{max-width:1100px;margin:25px auto;padding:0 15px}
.card{background:white;padding:22px;border-radius:12px;margin-bottom:20px;box-shadow:0 3px 12px #00000008}
h2{font-size:18px;color:#173e75;margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{display:flex;flex-direction:column;gap:7px}
.full{grid-column:1/-1}
label{font-weight:bold;font-size:13px}
input,select,textarea{padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;width:100%}
textarea{min-height:130px}
button{padding:11px 15px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}
.primary{background:#245da0;color:white}
.secondary{background:#e2e8f0;color:#173e75}
.danger{background:#fee2e2;color:#b91c1c}
.hidden{display:none!important}
.message{padding:12px;border-radius:8px;background:#eff6ff;margin-bottom:15px}
.error{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #e2e8f0;text-align:left}
th{background:#f8fafc;font-size:13px}
td{font-size:14px}
footer{text-align:center;padding:20px;color:#64748b;font-size:12px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}header h1{font-size:16px}.card{padding:15px}}
</style>
</head>

<body>

<header>
<div>
<h1>Гамшгаас хамгаалах сургалтын систем</h1>
<p>Цахим тайлан бүртгэл</p>
</div>
<button id="logoutBtn" class="secondary hidden" onclick="logout()">Гарах</button>
</header>

<main>

<!-- НЭВТРЭХ -->
<section id="loginCard" class="card">
<h2>Системд нэвтрэх</h2>
<div id="loginMessage" class="message hidden"></div>

<form id="loginForm">
<div class="field">
<label>Имэйл</label>
<input id="email" type="email" required>
</div>
<br>
<div class="field">
<label>Нууц үг</label>
<input id="password" type="password" required>
</div>
<div class="actions">
<button class="primary" type="submit">Нэвтрэх</button>
</div>
</form>
</section>

<!-- ҮНДСЭН СИСТЕМ -->
<section id="appSection" class="hidden">

<div id="appMessage" class="message hidden"></div>

<!-- ТАЙЛАН БҮРТГЭХ -->
<section class="card">
<h2 id="formHeading">Шинэ тайлан бүртгэх</h2>

<form id="reportForm">
<div class="grid">

<div class="field">
<label>Аймаг / хот *</label>
<select id="province" required>
<option value="">Аймаг сонгох</option>
</select>
</div>

<div class="field">
<label>Сум / дүүрэг *</label>
<select id="unit" required disabled>
<option value="">Эхлээд аймаг сонгоно уу</option>
</select>
</div>

<div class="field">
<label>Тайлангийн төрөл *</label>
<select id="reportType" required>
<option value="SM1">Гамшгаас хамгаалах сургалтын тайлан (SM1)</option>
</select>
</div>

<div class="field">
<label>Тайлант он *</label>
<select id="reportYear" required></select>
</div>

<div class="field">
<label>Тайлант хугацаа *</label>
<select id="period">
<option value="month">Сар</option>
<option value="quarter">Улирал</option>
<option value="half">Хагас жил</option>
<option value="year">Жил</option>
</select>
</div>

<div class="field" id="monthField">
<label>Сар</label>
<select id="reportMonth"></select>
</div>

<div class="field hidden" id="quarterField">
<label>Улирал</label>
<select id="reportQuarter">
<option value="1">I улирал</option>
<option value="2">II улирал</option>
<option value="3">III улирал</option>
<option value="4">IV улирал</option>
</select>
</div>

<div class="field hidden" id="halfField">
<label>Хагас жил</label>
<select id="reportHalf">
<option value="1">I хагас жил</option>
<option value="2">II хагас жил</option>
</select>
</div>

<div class="field full">
<label>Тайлангийн гарчиг *</label>
<input id="title" required placeholder="Тайлангийн гарчиг">
</div>

<div class="field full">
<label>Тайлангийн агуулга *</label>
<textarea id="description" required placeholder="Тайлангийн дэлгэрэнгүй мэдээлэл"></textarea>
</div>

</div>

<div class="actions">
<button id="saveButton" class="primary" type="submit">💾 Тайлан хадгалах</button>
<button id="cancelButton" class="secondary hidden" type="button" onclick="cancelEdit()">Болих</button>
</div>
</form>
</section>

<!-- ТАЙЛАНГИЙН ЖАГСААЛТ -->
<section class="card">
<h2>Миний бүртгэсэн тайлан</h2>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>№</th>
<th>Аймаг / сум</th>
<th>Хугацаа</th>
<th>Гарчиг</th>
<th>Үйлдэл</th>
</tr>
</thead>
<tbody id="reportsBody">
<tr><td colspan="5">Тайлан ачаалж байна...</td></tr>
</tbody>
</table>
</div>
</section>

</section>
</main>

<footer>Гамшгаас хамгаалах сургалтын систем</footer>

<script>
// SUPABASE
const SUPABASE_URL="https://djzlkhvkpmhgxoykeozt.supabase.co";
const SUPABASE_KEY="sb_publishable_iBVTq-ruWQDXLWTEO4wqAA_PT1AKG3d";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;
let editingId=null;
let reportCache=[];

const $=id=>document.getElementById(id);

// МЭДЭГДЭЛ
function message(id,text,type=""){
const e=$(id);
e.textContent=text;
e.className="message "+type;
e.classList.remove("hidden");
}
function hideMessage(id){$(id).classList.add("hidden");}

// ОН, САР
function initDate(){
const year=$("reportYear");
const now=new Date().getFullYear();
for(let y=now;y>=now-5;y--){
let o=document.createElement("option");
o.value=y;o.textContent=y;
year.appendChild(o);
}
const month=$("reportMonth");
for(let m=1;m<=12;m++){
let o=document.createElement("option");
o.value=m;o.textContent=m+" сар";
month.appendChild(o);
}
month.value=new Date().getMonth()+1;
}

// ХУГАЦАА СОНГОЛТ
function updatePeriod(){
const p=$("period").value;
$("monthField").classList.toggle("hidden",p!=="month");
$("quarterField").classList.toggle("hidden",p!=="quarter");
$("halfField").classList.toggle("hidden",p!=="half");
}

function periodData(){
const p=$("period").value;
return {
report_month:p==="month"?Number($("reportMonth").value):null,
report_quarter:p==="quarter"?Number($("reportQuarter").value):null,
report_half:p==="half"?Number($("reportHalf").value):null
};
}

function periodText(r){
if(r.report_month)return r.report_month+" сар";
if(r.report_quarter)return r.report_quarter+" улирал";
if(r.report_half)return r.report_half+" хагас жил";
return "Бүтэн жил";
}

// АЙМАГ АЧААЛАХ
async function loadProvinces(selected=null){
const sel=$("province");
sel.innerHTML='<option value="">Аймаг сонгох</option>';

const {data,error}=await db
.from("provinces")
.select("id,name")
.order("id");

if(error){
message("appMessage","Аймаг ачаалах алдаа: "+error.message,"error");
return;
}

(data||[]).forEach(p=>{
const o=document.createElement("option");
o.value=p.id;
o.textContent=p.name;
sel.appendChild(o);
});

if(selected)sel.value=String(selected);
}

// СУМ АЧААЛАХ
async function loadUnits(provinceId,selected=null){
const sel=$("unit");
sel.innerHTML='<option value="">Сум / дүүрэг сонгох</option>';
sel.disabled=true;

if(!provinceId){
sel.innerHTML='<option value="">Эхлээд аймаг сонгоно уу</option>';
return;
}

const {data,error}=await db
.from("units")
.select("id,name")
.eq("province_id",Number(provinceId))
.order("name");

if(error){
message("appMessage","Сум ачаалах алдаа: "+error.message,"error");
return;
}

if(!data||data.length===0){
sel.innerHTML='<option value="">Сум бүртгэгдээгүй байна</option>';
return;
}

data.forEach(u=>{
const o=document.createElement("option");
o.value=u.id;
o.textContent=u.name;
sel.appendChild(o);
});

sel.disabled=false;
if(selected)sel.value=String(selected);
}

// ФОРМ ЦЭВЭРЛЭХ
function resetForm(){
editingId=null;
$("reportForm").reset();
$("reportYear").value=new Date().getFullYear();
$("reportMonth").value=new Date().getMonth()+1;
$("unit").innerHTML='<option value="">Эхлээд аймаг сонгоно уу</option>';
$("unit").disabled=true;
$("formHeading").textContent="Шинэ тайлан бүртгэх";
$("saveButton").textContent="💾 Тайлан хадгалах";
$("cancelButton").classList.add("hidden");
}

function cancelEdit(){
resetForm();
hideMessage("appMessage");
}

// HTML АЮУЛГҮЙ ТЕКСТ
function esc(v){
return String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

// ТАЙЛАН АЧААЛАХ
async function loadReports(){
const body=$("reportsBody");
body.innerHTML='<tr><td colspan="5">Ачаалж байна...</td></tr>';

const {data,error}=await db
.from("reports")
.select("*")
.eq("created_by",currentUser.id)
.order("created_at",{ascending:false});

if(error){
body.innerHTML='<tr><td colspan="5">Алдаа: '+esc(error.message)+'</td></tr>';
return;
}

reportCache=data||[];

if(!reportCache.length){
body.innerHTML='<tr><td colspan="5">Тайлан бүртгээгүй байна.</td></tr>';
return;
}

body.innerHTML="";

reportCache.forEach((r,i)=>{
const tr=document.createElement("tr");

tr.innerHTML=`
<td>${i+1}</td>
<td>${esc(r.province_id)} / ${esc(r.unit_id)}</td>
<td>${esc(r.report_year)} · ${esc(periodText(r))}</td>
<td>${esc(r.title)}</td>
<td>
<button class="secondary" onclick="editReport('${r.id}')">Засах</button>
<button class="danger" onclick="deleteReport('${r.id}')">Устгах</button>
</td>`;

body.appendChild(tr);
});
}

// ТАЙЛАН ХАДГАЛАХ
async function saveReport(e){
e.preventDefault();
hideMessage("appMessage");

const provinceId=$("province").value;
const unitId=$("unit").value;

if(!provinceId||!unitId){
message("appMessage","Аймаг болон сум/дүүргээ сонгоно уу.","error");
return;
}

const record={
province_id:Number(provinceId),
unit_id:Number(unitId),
report_type:$("reportType").value,
report_year:Number($("reportYear").value),
...periodData(),
title:$("title").value.trim(),
description:$("description").value.trim(),
created_by:currentUser.id
};

const btn=$("saveButton");
btn.disabled=true;
btn.textContent="Хадгалж байна...";

let result;

if(editingId){
result=await db.from("reports")
.update(record)
.eq("id",editingId)
.eq("created_by",currentUser.id);
}else{
result=await db.from("reports").insert(record);
}

btn.disabled=false;

if(result.error){
btn.textContent=editingId?"Өөрчлөлт хадгалах":"💾 Тайлан хадгалах";
message("appMessage","Хадгалах алдаа: "+result.error.message,"error");
return;
}

message("appMessage",editingId?"Тайлан шинэчлэгдлээ.":"Тайлан хадгалагдлаа.","success");
resetForm();
await loadReports();
}

// ТАЙЛАН ЗАСАХ
async function editReport(id){
const r=reportCache.find(x=>String(x.id)===String(id));
if(!r)return;

editingId=r.id;
$("formHeading").textContent="Тайлан засварлах";
$("saveButton").textContent="Өөрчлөлт хадгалах";
$("cancelButton").classList.remove("hidden");

$("reportType").value=r.report_type||"SM1";
$("reportYear").value=r.report_year;
$("title").value=r.title||"";
$("description").value=r.description||"";

if(r.report_month){
$("period").value="month";
$("reportMonth").value=r.report_month;
}else if(r.report_quarter){
$("period").value="quarter";
$("reportQuarter").value=r.report_quarter;
}else if(r.report_half){
$("period").value="half";
$("reportHalf").value=r.report_half;
}else{
$("period").value="year";
}

updatePeriod();
await loadProvinces(r.province_id);
await loadUnits(r.province_id,r.unit_id);
window.scrollTo({top:0,behavior:"smooth"});
}

// ТАЙЛАН УСТГАХ
async function deleteReport(id){
if(!confirm("Энэ тайланг устгах уу?"))return;

const {error}=await db.from("reports")
.delete()
.eq("id",id)
.eq("created_by",currentUser.id);

if(error){
message("appMessage","Устгах алдаа: "+error.message,"error");
return;
}

message("appMessage","Тайлан устгагдлаа.","success");
await loadReports();
}

// НЭВТРЭХ
$("loginForm").addEventListener("submit",async e=>{
e.preventDefault();
hideMessage("loginMessage");

const {data,error}=await db.auth.signInWithPassword({
email:$("email").value.trim(),
password:$("password").value
});

if(error){
message("loginMessage","Нэвтрэх алдаа: "+error.message,"error");
return;
}

await showApp(data.user);
});

// ГАРАХ
async function logout(){
await db.auth.signOut();
currentUser=null;
showLoggedOut();
}

function showLoggedOut(){
$("loginCard").classList.remove("hidden");
$("appSection").classList.add("hidden");
$("logoutBtn").classList.add("hidden");
}

// СИСТЕМ НЭЭХ
async function showApp(user){
currentUser=user;
$("loginCard").classList.add("hidden");
$("appSection").classList.remove("hidden");
$("logoutBtn").classList.remove("hidden");

await loadProvinces();
await loadReports();
resetForm();
}

// EVENT
$("reportForm").addEventListener("submit",saveReport);
$("province").addEventListener("change",()=>loadUnits($("province").value));
$("period").addEventListener("change",updatePeriod);

initDate();
updatePeriod();

db.auth.getSession().then(async({data})=>{
if(data.session)await showApp(data.session.user);
else showLoggedOut();
});
</script>
</body>
</html>
